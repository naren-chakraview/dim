version: 1
imports:
  - ../governance/fragments.yaml
sources:
  orders-in:
    type: file
    path: ./orders.jsonl
routes:
  order-payment:
    from: orders-in
    error_path:
      target: payments-dlq
    steps:
      - filter:
          expr: body.amount > 100
sinks:
  payments-processed:
    type: file
    path: ./output/payments-processed.jsonl
  payments-dlq:
    type: file
    path: ./output/payments-dlq.jsonl
