version: 1
imports:
  - ../governance/fragments.yaml
sources:
  orders-in:
    type: file
    path: ./orders.jsonl
routes:
  order-payment:
    from: orders-in
    error_path:
      target: error
    steps:
      - filter:
          expr: true
sinks:
  output:
    type: file
    path: ./output/payments-processed.jsonl
  error:
    type: file
    path: ./output/payments-dlq.jsonl
