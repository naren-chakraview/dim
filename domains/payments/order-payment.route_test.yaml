route: order-payment

fixtures:
  - name: low-value order payment processes successfully
    input:
      body:
        order_id: "ord-001"
        amount: 500000
        currency: "USD"
        customer_id: "cust-123"
      headers: {}
    expected_output:
      body:
        payment_id: "ord-001"
        amount_cents: 500000
        currency: "USD"
        customer_id: "cust-123"
      headers: {}

  - name: high-value order triggers alert
    input:
      body:
        order_id: "ord-002"
        amount: 1500000
        currency: "USD"
        customer_id: "cust-456"
      headers: {}
    expected_route: payments-high-value
    expected_output:
      body:
        payment_id: "ord-002"
        amount_cents: 1500000
        currency: "USD"
        customer_id: "cust-456"
      headers: {}

  - name: missing amount goes to error path
    input:
      body:
        order_id: "ord-003"
        customer_id: "cust-789"
      headers: {}
    expected_dropped: true

  - name: currency defaults to USD when not provided
    input:
      body:
        order_id: "ord-004"
        amount: 250000
        customer_id: "cust-999"
      headers: {}
    expected_output:
      body:
        payment_id: "ord-004"
        amount_cents: 250000
        currency: "USD"
        customer_id: "cust-999"
      headers: {}
