route: order-payment

fixtures:
  - name: low-value order payment processes successfully
    input:
      body:
        order_id: "ord-001"
        amount: 500000
        currency: "USD"
        customer_id: "cust-123"
      headers: {}
    expected_output:
      body:
        order_id: "ord-001"
        amount: 500000
        currency: "USD"
        customer_id: "cust-123"
      headers: {}

  - name: high-value order processes successfully
    input:
      body:
        order_id: "ord-002"
        amount: 1500000
        currency: "USD"
        customer_id: "cust-456"
      headers: {}
    expected_output:
      body:
        order_id: "ord-002"
        amount: 1500000
        currency: "USD"
        customer_id: "cust-456"
      headers: {}

  - name: missing amount goes to dead-letter
    input:
      body:
        order_id: "ord-003"
        customer_id: "cust-789"
      headers: {}
    expected_dropped: true

  - name: order without currency processes successfully
    input:
      body:
        order_id: "ord-004"
        amount: 250000
        customer_id: "cust-999"
      headers: {}
    expected_output:
      body:
        order_id: "ord-004"
        amount: 250000
        customer_id: "cust-999"
      headers: {}
