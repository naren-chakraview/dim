route: order-payment

fixtures:
  - name: low-value order payment processes successfully
    input:
      body:
        order_id: "ord-001"
        amount: 500000
        currency: "USD"
        customer_id: "cust-123"
      headers: {}
    steps:
      - filter: { expr: 'body.amount != null and body.order_id != null' }
      - translate:
          expr: |
            {
              "payment_id": body.order_id,
              "amount_cents": body.amount,
              "currency": body.currency ? body.currency : "USD",
              "customer_id": body.customer_id,
              "timestamp": metadata.timestamp
            }
      - idempotent:
          key_expr: 'body.payment_id'
      - route:
          expr: 'body.amount_cents > 1000000 ? "high_value" : "standard"'
          cases:
            high_value:
              target: payments-high-value
            standard:
              target: payments-processed
          default: payments-processed
    expect:
      body:
        payment_id: "ord-001"
        amount_cents: 500000
        currency: "USD"

  - name: high-value order triggers alert
    input:
      body:
        order_id: "ord-002"
        amount: 1500000
        currency: "USD"
        customer_id: "cust-456"
      headers: {}
    steps:
      - filter: { expr: 'body.amount != null and body.order_id != null' }
      - translate:
          expr: |
            {
              "payment_id": body.order_id,
              "amount_cents": body.amount,
              "currency": body.currency ? body.currency : "USD",
              "customer_id": body.customer_id,
              "timestamp": metadata.timestamp
            }
      - idempotent:
          key_expr: 'body.payment_id'
      - route:
          expr: 'body.amount_cents > 1000000 ? "high_value" : "standard"'
          cases:
            high_value:
              target: payments-high-value
            standard:
              target: payments-processed
          default: payments-processed
    expect:
      body:
        payment_id: "ord-002"
        amount_cents: 1500000
        currency: "USD"

  - name: missing amount goes to error path
    input:
      body:
        order_id: "ord-003"
        customer_id: "cust-789"
      headers: {}
    steps:
      - filter: { expr: 'body.amount != null and body.order_id != null' }
    expect:
      output: []

  - name: currency defaults to USD when not provided
    input:
      body:
        order_id: "ord-004"
        amount: 250000
        customer_id: "cust-999"
      headers: {}
    steps:
      - filter: { expr: 'body.amount != null and body.order_id != null' }
      - translate:
          expr: |
            {
              "payment_id": body.order_id,
              "amount_cents": body.amount,
              "currency": body.currency ? body.currency : "USD",
              "customer_id": body.customer_id,
              "timestamp": metadata.timestamp
            }
    expect:
      body:
        payment_id: "ord-004"
        amount_cents: 250000
        currency: "USD"
