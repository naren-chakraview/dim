# Order Processing Pipeline — Phase 1 Complete Worked Example (R19, R20)
# A production-like route exercising Phase 1 capabilities:
# - Config imports and fragments (via common-steps.yaml)
# - PBAC (Attribute-Based Authorization with OPA) - M1.2 (R19)
# - OBO (On-Behalf-Of token exchange) - M1.3 (R19)
# - OpenLineage/Marquez export with schema facets - M1.7 (R19, R20)
# - Data contracts with automatic schema facet generation - M1.7.3 (R20)
# - Lineage export dead-letter path for failed exports - M1.7.4 (R20)
# - SFTP file ingestion - R21
# - Wiretap for audit logging
# - JSONata expressions with custom functions
# - Content-based routing
# - Error handling with dead-letter queues
# - Message lineage with retention policies

version: 1

# Import shared configuration (fragments, functions)
imports:
  - common-steps.yaml

sources:
  webhook-in:
    type: http
    desc: 'HTTP webhook for order ingestion'

  sftp-orders:
    type: sftp
    config:
      host: sftp.example.com
      port: 22
      user: orders_user
      password: ${SECRET:SFTP_PASSWORD}
      path: /incoming/orders
      schedule: "1h"
    desc: 'SFTP polling for batch order files (R21)'

sinks:
  orders-valid:
    type: file
    path: ./output/orders-valid.jsonl
    desc: 'Successfully processed orders'

  orders-dlq:
    type: file
    path: ./output/orders-dlq.jsonl
    desc: 'Dead-letter queue for retryable failures'

  unauthorized-dlq:
    type: file
    path: ./output/orders-unauthorized.jsonl
    desc: 'Orders rejected due to authorization denial (PBAC)'

  lineage-export-dlq:
    type: file
    path: ./output/lineage-export-dlq.jsonl
    desc: 'Orders that failed OpenLineage export (M1.7.4, R20)'

  audit-log:
    type: file
    path: ./output/orders-audit.jsonl
    desc: 'Audit trail of all inbound orders before processing'

routes:
  ingest-orders:
    from: webhook-in
    auth: pbac
    desc: 'Main order ingestion with PBAC authorization (M1.2, R19)'

    # Data contract with automatic schema facet generation (M1.7.3, R20)
    contracts:
      - id: order-contract
        version: "1.0.0"
        schema: |
          {
            "type": "object",
            "properties": {
              "order_id": {"type": "string"},
              "customer_name": {"type": "string"},
              "total": {"type": "number"},
              "currency": {"type": "string"},
              "timestamp": {"type": "string"}
            },
            "required": ["order_id", "customer_name", "total"]
          }

    # OpenLineage/Marquez configuration with dead-letter path (M1.7, R20)
    lineage:
      retention_policy: default
      desc: 'Keep order lineage for 90 days'
      openlineage:
        enabled: true
        marquez_url: http://localhost:5000
        on_export_failure: lineage-export-dlq  # Dead-letter for failed exports (M1.7.4, R20)

    error_path:
      target: orders-dlq
      retry:
        max_attempts: 3
        backoff_ms: 500

    steps:
      # Step 1: capture all inbound orders in audit log (side effect only)
      - wiretap:
          to: audit-log
          desc: 'Log all incoming orders for audit trail'

      # Step 2: PBAC authorization with OPA (M1.2, R19)
      # OPA checks attributes from JWT: subject_id, department, role
      # Policies defined in OPA enforce: sellers can only process their own orders
      - authorize:
          mode: pbac
          opa_policy: order_processing.rego
          opa_subject: ${JWT:subject_id}
          opa_attributes:
            department: ${JWT:department}
            role: ${JWT:role}
            order_customer: body.customer_id
          on_deny:
            to: unauthorized-dlq
          desc: 'Enforce attribute-based access control with OPA (PBAC, M1.2)'

      # Step 2.5: OBO token exchange for downstream services (M1.3, R19)
      # Exchange user's JWT for access token scoped to order-service
      - translate:
          expr: |
            {
              "subject_token": $headers.authorization,
              "subject_token_type": "urn:ietf:params:oauth:token-type:jwt",
              "resource": "order-service",
              "requested_token_type": "urn:ietf:params:oauth:token-type:access_token"
            }
          desc: 'Prepare OBO token exchange request (M1.3)'

      - factory:
          target_service: https://auth-service/token
          method: POST
          body_from_message: true
          desc: 'Exchange token on-behalf-of user for order-service scope (OBO, M1.3)'

      # Step 3-4: Validate and deduplicate
      - filter:
          expr: 'body.id != null and body.amount != null'
          desc: 'Reject orders missing required fields'

      - idempotent:
          key: 'body.id'
          desc: 'Deduplicate orders by id'

      # Step 5: Transform the order structure
      # Schema facet is automatically generated from contract (M1.7.3, R20)
      - translate:
          expr: |
            {
              "order_id": body.id,
              "customer_name": body.customer_name,
              "total": body.amount / 100,
              "currency": body.currency ? body.currency : "USD",
              "phone": body.phone,
              "timestamp": $now(),
              "order_value": body.amount > 10000 ? "high" : "standard"
            }
          desc: 'Normalize and enrich order data'

      # Step 6: Route to output (lineage and schema facet auto-tracked)
      - route_step:
          output: orders-valid
          desc: 'Output successfully processed orders (lineage with schema facet - M1.7.3, M1.7.4)'

  ingest-sftp-orders:
    from: sftp-orders
    auth: none
    desc: 'Batch order ingestion from SFTP (R21)'

    contracts:
      - id: order-contract
        version: "1.0.0"
        schema: |
          {
            "type": "object",
            "properties": {
              "order_id": {"type": "string"},
              "customer_name": {"type": "string"},
              "total": {"type": "number"},
              "currency": {"type": "string"},
              "timestamp": {"type": "string"}
            },
            "required": ["order_id", "customer_name", "total"]
          }

    lineage:
      retention_policy: default
      openlineage:
        enabled: true
        marquez_url: http://localhost:5000
        on_export_failure: lineage-export-dlq

    steps:
      - filter:
          expr: 'body.id != null and body.amount != null'
          desc: 'Filter valid orders from SFTP batch'

      - translate:
          expr: |
            {
              "order_id": body.id,
              "customer_name": body.customer_name,
              "total": body.amount / 100,
              "currency": body.currency ? body.currency : "USD",
              "timestamp": $now(),
              "source": "sftp"
            }
          desc: 'Transform SFTP batch orders'

      - route_step:
          output: orders-valid
          desc: 'Output SFTP orders with lineage tracking'

# References
# M1.2 (PBAC): Attribute-based authorization with OPA policy engine
#   - attributes extracted from JWT headers
#   - policies defined in OPA Rego language
#   - denials route to unauthorized-dlq for audit
#
# M1.3 (OBO): On-behalf-of token exchange
#   - User's JWT exchanged for service-scoped access token
#   - Allows delegated access to downstream services
#   - Scope limits token to specific resource
#
# M1.7 (OpenLineage/Marquez): Message lineage export
#   - Lineage automatically tracked at each step
#   - M1.7.3 (R20): Schema facets auto-generated from contracts
#   - M1.7.4 (R20): Failed exports route to lineage-export-dlq
#   - Enables data governance and provenance tracking
#
# R21 (SFTP): File ingestion with credentials via ${SECRET:name}
#   - Password and key authentication supported
#   - Schedule-based polling
#   - Integrated with lineage tracking
