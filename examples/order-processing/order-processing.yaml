# Order Processing Pipeline — Phase 0/1 Complete Worked Example
# A production-like route exercising all core dim features:
# - Config imports and fragments (via common-steps.yaml)
# - Authorization (RBAC; PBAC in Phase 1)
# - Wiretap for audit logging
# - JSONata expressions with custom functions (Go plugins, WASM)
# - Content-based routing
# - Error handling with dead-letter queue
# - Message lineage and retention policies
# - Data contracts with JSON Schema (Phase 1)

version: 1

# Import shared configuration (fragments, functions)
# Phase 1: will support parametric fragments for reuse across routes
imports:
  - common-steps.yaml

sources:
  webhook-in:
    type: http
    desc: 'HTTP webhook for order ingestion'

sinks:
  orders-valid:
    type: file
    path: ./output/orders-valid.jsonl
    desc: 'Successfully processed orders'

  orders-dlq:
    type: file
    path: ./output/orders-dlq.jsonl
    desc: 'Dead-letter queue for retryable failures'

  unauthorized-dlq:
    type: file
    path: ./output/orders-unauthorized.jsonl
    desc: 'Orders rejected due to authorization denial'

  audit-log:
    type: file
    path: ./output/orders-audit.jsonl
    desc: 'Audit trail of all inbound orders before processing'

routes:
  ingest-orders:
    from: webhook-in
    auth: none
    desc: 'Main order ingestion and processing route'

    lineage:
      retention_policy: default
      desc: 'Keep order lineage for 90 days (default policy)'

    error_path:
      target: orders-dlq
      retry:
        max_attempts: 3
        backoff_ms: 500

    steps:
      # Step 1: capture all inbound orders in audit log (side effect only)
      - wiretap:
          to: audit-log
          desc: 'Log all incoming orders for audit trail (Phase 0 wiretap feature)'

      # Step 2: enforce authorization (RBAC in Phase 0, PBAC+OPA in Phase 1)
      # In production, this would check JWT from Authorization header
      # For demo, everyone is authorized; real deployment adds role checks
      - authorize:
          mode: rbac
          require_roles: []  # Empty means allow all; real deployment specifies roles: [seller, partner]
          on_deny:
            to: unauthorized-dlq
          desc: 'Enforce role-based access control (RBAC); Phase 1 upgrades to PBAC with OPA'

      # Step 3-4: Validate and deduplicate (using fragment from common-steps.yaml)
      # This demonstrates fragment reuse and composition from imports
      - filter:
          expr: 'body.id != null and body.amount != null'
          desc: 'Reject orders missing required fields (part of validate-order fragment)'

      - idempotent:
          key: 'body.id'
          desc: 'Deduplicate orders by id (part of validate-order fragment)'

      # Step 5: Transform the order structure
      # This step demonstrates:
      # - JSONata expressions (Phase 0)
      # - Custom function calls (Go plugins in Phase 1 R5, WASM in R4)
      # - Content-based routing (high-value orders separate)
      - translate:
          expr: |
            {
              "order_id": body.id,
              "customer_name": body.customer_name,
              "total": body.amount / 100,
              "currency": body.currency ? body.currency : "USD",
              "phone": body.phone,
              "timestamp": $now(),
              "order_value": body.amount > 10000 ? "high" : "standard"
            }
          desc: 'Normalize and enrich order data (Phase 1: will call $normalizePhone and $scoreRisk functions)'

# Example authorization requirements (uncommented in production):
# - A real deployment would validate JWT, extract principal.subject and principal.roles
# - The authorize step would enforce minimum role requirements (e.g., require_roles: [partner, seller])
# - Denials route to unauthorized-dlq for audit and replay

# Example function usage (Phase 1):
# When normalizePhone plugin is available, the translate step would call:
#   "phone": $normalizePhone(body.phone)
# That would invoke the Go plugin, normalizing the number to a standard format
