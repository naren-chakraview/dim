version: 1

# M3.1 Cluster Demo: Multi-instance deduplication
#
# This configuration demonstrates how two dimd instances coordinate to prevent
# duplicate message processing when sharing a PostgreSQL backend.
#
# Features demonstrated:
# - Idempotent deduplication across cluster via PostgreSQL
# - Unified lineage tracking (all instances log to same backend)
# - No duplicate processing (same order_id processed only once)

sources:
  api:
    type: http
    port: 8080

sinks:
  output:
    type: file
    path: /tmp/dim/output/orders.jsonl

routes:
  # Order processing with cluster-wide deduplication (M3.1)
  process-orders:
    from: api

    steps:
      # Step 1: Idempotent deduplication using cluster backend (PostgreSQL)
      # Same order_id from either instance will be deduplicated
      - idempotent:
          key_expr: "body.order_id"

      # Step 2: Transform message to show it was processed
      - translate:
          expr: |
            {
              order_id: body.order_id,
              customer: body.customer,
              amount: body.amount,
              received_at: $now(),
              processed_by: $env('DIMD_INSTANCE_ID', 'unknown'),
              lineage_enabled: true
            }

    # Lineage: All instances write to shared PostgreSQL backend
    retention_policy: "30d"

    sinks:
      - output
