version: 1

sources:
  http-source:
    type: http
    url: http://localhost:8080/ingest

sinks:
  output:
    type: file
    path: ./output/messages.jsonl
  errors:
    type: file
    path: ./output/errors.jsonl

routes:
  test-route:
    from: http-source
    auth: none
    error_path:
      target: errors
    steps:
      - filter:
          expr: "amount > 0"
      - translate:
          expr: "{name: name, amount: amount * 1.1, timestamp: $now()}"
