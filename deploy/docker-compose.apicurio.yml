version: '3.8'

services:
  apicurio:
    image: apicurio/apicurio-registry:latest
    container_name: apicurio-registry
    ports:
      - "8081:8080"
    environment:
      REGISTRY_AUTH_ENABLED: "false"
      REGISTRY_UI_CONFIG_AUTH_ENABLED: "false"
    volumes:
      - apicurio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  apicurio-data:
