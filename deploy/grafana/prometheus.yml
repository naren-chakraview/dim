global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'dim-middleware'

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            # - 'alertmanager:9093'

rule_files:
  # - "first_rules.yml"
  # - "second_rules.yml"

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Scrape DIM middleware metrics endpoint
  # Update the URL to match your middleware's metrics endpoint
  - job_name: 'dim-middleware'
    static_configs:
      - targets: ['localhost:8080']
        labels:
          service: 'dim'
    metrics_path: '/metrics'
    scrape_interval: 30s
