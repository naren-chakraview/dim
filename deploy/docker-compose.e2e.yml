# E2E Test Environment
# Provides all external dependencies required for end-to-end testing
# Services auto-start and health checks ensure readiness before tests run

services:
  # Zookeeper for Kafka coordination (more stable than KRaft)
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: dim-e2e-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    networks:
      - dim-e2e

  # Message Queue: Kafka with Zookeeper (more reliable than KRaft)
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: dim-e2e-kafka
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'
      KAFKA_DELETE_TOPIC_ENABLE: 'true'
    ports:
      - "9092:9092"
      - "29092:29092"
    healthcheck:
      test: kafka-broker-api-versions --bootstrap-server localhost:9092
      interval: 5s
      timeout: 10s
      retries: 5
      start_period: 15s
    networks:
      - dim-e2e

  # Relational Database: PostgreSQL
  postgres:
    image: postgres:16-alpine
    container_name: dim-e2e-postgres
    environment:
      POSTGRES_DB: dim_e2e
      POSTGRES_USER: dim_test
      POSTGRES_PASSWORD: test_password
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_e2e_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dim_test -d dim_e2e"]
      interval: 5s
      timeout: 10s
      retries: 5
    networks:
      - dim-e2e

  # Topic initialization: create e2e test topic
  kafka-init:
    image: confluentinc/cp-kafka:7.6.0
    container_name: dim-e2e-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: /bin/bash
    command:
      - -c
      - "kafka-topics --create --topic e2e-test-messages --bootstrap-server kafka:29092 --partitions 1 --replication-factor 1 --if-not-exists && echo 'Topic created successfully'"
    networks:
      - dim-e2e

  # S3-compatible object storage: LocalStack (lightweight S3 mock for testing)
  # LocalStack provides a fully functional S3 service on a single port (4566)
  # No Docker Hub rate limits, perfect for CI/CD environments
  localstack:
    image: localstack/localstack:3.0.0
    container_name: dim-e2e-localstack
    environment:
      SERVICES: s3
      DEBUG: 0
      # Use in-memory backend for speed in CI (no disk I/O)
      PERSISTENCE: 0
      # Force immediate S3 service loading
      EAGER_SERVICE_LOADING: 1
      # Disable detailed logging to speed up initialization
      LOG_LEVEL: warn
      # Skip authentication/licensing for CI environments
      SKIP_HEALTH_CHECK: 0
      DISABLE_MOTO_METRICS: 1
    ports:
      - "127.0.0.1:4566:4566"
    healthcheck:
      # Simple health check - real readiness is checked via aws s3 ls in CI
      test: ["CMD", "curl", "-sf", "http://localhost:4566/_localstack/health"]
      interval: 1s
      timeout: 3s
      retries: 15
      start_period: 20s
    networks:
      - dim-e2e

  # Metrics: Prometheus
  prometheus:
    image: prom/prometheus:v2.40.0
    container_name: dim-e2e-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.e2e.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9090/-/healthy"]
      interval: 5s
      timeout: 10s
      retries: 5
    networks:
      - dim-e2e

volumes:
  postgres_e2e_data:

networks:
  dim-e2e:
    driver: bridge
