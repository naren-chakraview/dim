version: '3.8'

# Marquez local development environment (M1.7.1)
# Usage: docker-compose -f deploy/docker-compose.marquez.yml up -d

services:
  postgres:
    image: postgres:14-alpine
    container_name: dim-marquez-db
    environment:
      POSTGRES_DB: marquez
      POSTGRES_USER: marquez
      POSTGRES_PASSWORD: marquez
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./marquez-init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marquez"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - dim-marquez

  marquez:
    image: marquezproject/marquez:0.45.0
    container_name: dim-marquez-api
    environment:
      MARQUEZ_DB_HOST: postgres
      MARQUEZ_DB_NAME: marquez
      MARQUEZ_DB_USER: marquez
      MARQUEZ_DB_PASSWORD: marquez
      MARQUEZ_PORT: 5000
    ports:
      - "5000:5000"   # HTTP API
      - "3000:3000"   # Web UI
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:5000/api/v1/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - dim-marquez

  rabbitmq:
    image: rabbitmq:3.12-management
    container_name: dim-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"   # AMQP
      - "15672:15672" # Management UI
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - dim-marquez

volumes:
  postgres_data:
  rabbitmq_data:

networks:
  dim-marquez:
    driver: bridge
