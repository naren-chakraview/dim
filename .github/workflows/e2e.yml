name: E2E Tests

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  e2e-tests:
    name: End-to-End Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.26.7'

      - name: Ensure AWS CLI is available
        run: |
          which aws || pip install awscli
          aws --version

      - name: Start services with Docker Compose
        run: |
          cd deploy
          docker compose -f docker-compose.e2e.yml up -d

          # Wait for services in order: Kafka, PostgreSQL, then LocalStack
          echo "Waiting for Kafka to be ready..."
          for i in {1..30}; do
            if timeout 2 bash -c "echo > /dev/tcp/localhost/9092" 2>/dev/null; then
              echo "✓ Kafka is ready"
              break
            fi
            echo "  Attempt $i/30..."
            sleep 2
          done

          echo "Waiting for PostgreSQL to be ready..."
          for i in {1..30}; do
            if timeout 2 bash -c "echo > /dev/tcp/localhost/5432" 2>/dev/null; then
              echo "✓ PostgreSQL is ready"
              break
            fi
            echo "  Attempt $i/30..."
            sleep 2
          done

          echo "Waiting for LocalStack to be ready..."
          for i in {1..30}; do
            if curl -f http://localhost:4566/_localstack/health 2>/dev/null | grep -q '"s3": "running"'; then
              echo "✓ LocalStack S3 is ready"
              break
            fi
            echo "  Attempt $i/30..."
            sleep 2
          done

      - name: Initialize S3 bucket in LocalStack
        run: |
          # LocalStack S3 service needs significant time to initialize
          # Use aggressive retries with exponential backoff
          echo "Waiting for LocalStack S3 to be fully ready..."

          TOTAL_ATTEMPTS=0
          MAX_ATTEMPTS=60  # Try for up to 60 * 2 = 120 seconds

          while [ $TOTAL_ATTEMPTS -lt $MAX_ATTEMPTS ]; do
            echo "[$(($TOTAL_ATTEMPTS * 2))s] Attempt $((TOTAL_ATTEMPTS + 1)): checking S3..."

            # Try to list buckets - real S3 readiness check
            if aws s3 ls --endpoint-url http://localhost:4566 --region us-east-1 2>&1; then
              echo "✓ LocalStack S3 is responding!"

              # Now create the bucket
              echo "Creating test bucket..."
              for bucket_attempt in {1..5}; do
                if aws s3 mb s3://test-bucket \
                  --endpoint-url http://localhost:4566 \
                  --region us-east-1 2>&1 | grep -qE "(Successfully|already)"; then
                  echo "✓ Bucket created or already exists"

                  # Verify
                  echo "Verifying bucket..."
                  aws s3 ls --endpoint-url http://localhost:4566 --region us-east-1
                  exit 0
                else
                  echo "  Bucket creation attempt $bucket_attempt failed, retrying..."
                  sleep 1
                fi
              done
            fi

            TOTAL_ATTEMPTS=$((TOTAL_ATTEMPTS + 1))
            sleep 2
          done

          # If we get here, LocalStack S3 never became ready
          echo "✗ LocalStack S3 failed to become ready after 120 seconds"
          echo "LocalStack logs:"
          docker logs dim-e2e-localstack | tail -100
          exit 1
        env:
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test
          AWS_DEFAULT_REGION: us-east-1

      - name: Run e2e tests
        run: go test -v -tags=e2e -timeout 5m ./cmd/dimd/...
        env:
          KAFKA_BROKERS: localhost:9092
          DATABASE_URL: postgres://dim_test:test_password@localhost:5432/dim_e2e?sslmode=disable
          S3_ENDPOINT: http://localhost:4566
          S3_ACCESS_KEY: test
          S3_SECRET_KEY: test
          S3_BUCKET: test-bucket
          AWS_DEFAULT_REGION: us-east-1

      - name: Stop services
        if: always()
        run: |
          cd deploy
          docker compose -f docker-compose.e2e.yml down -v

      - name: Upload test logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-logs
          path: /tmp/e2e-test-output.log
          retention-days: 7
