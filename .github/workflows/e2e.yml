name: E2E Tests

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  e2e-tests:
    name: End-to-End Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.26.7'

      - name: Start services with docker-compose
        run: |
          cd deploy
          docker-compose -f docker-compose.e2e.yml up -d

          # Wait for services to be ready
          echo "Waiting for services to be ready..."
          for i in {1..30}; do
            if timeout 2 bash -c "echo > /dev/tcp/localhost/9092" 2>/dev/null && \
               curl -f http://localhost:9000/minio/health/live 2>/dev/null && \
               timeout 2 bash -c "echo > /dev/tcp/localhost/5432" 2>/dev/null; then
              echo "All services are ready!"
              break
            fi
            echo "Attempt $i/30: Waiting for services..."
            sleep 2
          done

      - name: Run e2e tests
        run: go test -v -tags=e2e -timeout 5m ./cmd/dimd/...
        env:
          KAFKA_BROKERS: localhost:9092
          DATABASE_URL: postgres://dim_test:test_password@localhost:5432/dim_e2e?sslmode=disable
          S3_ENDPOINT: http://localhost:9000
          S3_ACCESS_KEY: minioadmin
          S3_SECRET_KEY: minioadmin

      - name: Stop services
        if: always()
        run: |
          cd deploy
          docker-compose -f docker-compose.e2e.yml down -v

      - name: Upload test logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-logs
          path: /tmp/e2e-test-output.log
          retention-days: 7
