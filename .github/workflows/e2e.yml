name: E2E Tests

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  e2e-tests:
    name: End-to-End Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      # Kafka message broker (KRaft mode - no Zookeeper needed)
      kafka:
        image: apache/kafka:3.9.0
        env:
          KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
          KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092
          KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
          KAFKA_PROCESS_ROLES: broker,controller
          KAFKA_NODE_ID: 1
          KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
          KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
          KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
          KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
          KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
          KAFKA_LOG_RETENTION_HOURS: 1
        ports:
          - 9092:9092

      # S3-compatible object storage: MinIO
      minio:
        image: minio/minio:RELEASE.2024-10-02T17-50-41Z
        env:
          MINIO_ROOT_USER: minioadmin
          MINIO_ROOT_PASSWORD: minioadmin
        ports:
          - 9000:9000
        options: >-
          --health-cmd "curl -f http://localhost:9000/minio/health/live"
          --health-interval 5s
          --health-timeout 10s
          --health-retries 10
          --network-alias minio

      # PostgreSQL database
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: dim_e2e
          POSTGRES_USER: dim_test
          POSTGRES_PASSWORD: test_password
          # Disable fsync for faster startup in CI
          POSTGRES_INITDB_ARGS: "-c fsync=off"
        options: >-
          --health-cmd "pg_isready -U dim_test -d dim_e2e"
          --health-interval 10s
          --health-timeout 15s
          --health-retries 10
          --network-alias postgres
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.26.7'

      - name: Run e2e tests
        run: go test -v -tags=e2e -timeout 5m ./cmd/dimd/...
        env:
          KAFKA_BROKERS: localhost:9092
          DATABASE_URL: postgres://dim_test:test_password@localhost:5432/dim_e2e?sslmode=disable
          S3_ENDPOINT: http://localhost:9000
          S3_ACCESS_KEY: minioadmin
          S3_SECRET_KEY: minioadmin

      - name: Upload test logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-logs
          path: /tmp/e2e-test-output.log
          retention-days: 7
