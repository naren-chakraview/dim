name: E2E Tests

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  e2e-tests:
    name: End-to-End Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      # Zookeeper for Kafka coordination
      zookeeper:
        image: confluentinc/cp-zookeeper:7.5.0
        env:
          ZOOKEEPER_CLIENT_PORT: 2181
          ZOOKEEPER_TICK_TIME: 2000
          # Reduce startup time
          ZK_SYNC_LIMIT: 5
          ZK_INIT_LIMIT: 5
        options: >-
          --health-cmd "echo stat | nc -w 2 localhost 2181 || exit 1"
          --health-interval 5s
          --health-timeout 30s
          --health-retries 15
          --network-alias zookeeper

      # Kafka message broker
      kafka:
        image: confluentinc/cp-kafka:7.5.0
        env:
          KAFKA_BROKER_ID: 1
          KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
          KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
          KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
          KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
          KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
          KAFKA_BROKER_RACK: rack1
        options: >-
          --health-cmd "kafka-broker-api-versions --bootstrap-server localhost:9092 || exit 1"
          --health-interval 5s
          --health-timeout 30s
          --health-retries 20
          --network-alias kafka
        ports:
          - 9092:9092

      # PostgreSQL database
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: dim_e2e
          POSTGRES_USER: dim_test
          POSTGRES_PASSWORD: test_password
          # Disable fsync for faster startup in CI
          POSTGRES_INITDB_ARGS: "-c fsync=off"
        options: >-
          --health-cmd "pg_isready -U dim_test -d dim_e2e"
          --health-interval 10s
          --health-timeout 15s
          --health-retries 10
          --network-alias postgres
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.26.7'

      # Wait for services to be ready with detailed logging
      - name: Wait for services
        run: |
          echo "Waiting for services to be ready..."
          echo "Timeout per service: 60 seconds"
          echo ""

          echo "[1/4] Checking Zookeeper (port 2181)..."
          timeout 60 bash -c 'until (echo stat | nc -w 2 localhost 2181) >/dev/null 2>&1; do echo "  ... waiting"; sleep 2; done' || exit 1
          echo "✓ Zookeeper ready"

          echo "[2/4] Checking Kafka (port 9092)..."
          timeout 60 bash -c 'until nc -z -w 2 localhost 9092 >/dev/null 2>&1; do echo "  ... waiting"; sleep 2; done' || exit 1
          echo "✓ Kafka port open"

          echo "[3/4] Checking PostgreSQL (port 5432)..."
          timeout 60 bash -c 'until pg_isready -h localhost -U dim_test -d dim_e2e >/dev/null 2>&1; do echo "  ... waiting"; sleep 2; done' || exit 1
          echo "✓ PostgreSQL ready"

          echo ""
          echo "All required services ready!"
          echo "(Note: MinIO/S3 tests skipped in CI - optional for local testing)"

      # Run e2e tests
      - name: Run E2E Tests
        run: go test -tags e2e -v -race ./internal/integration/... -run "E2E" -timeout 10m
        env:
          KAFKA_BROKERS: localhost:9092
          DATABASE_URL: postgres://dim_test:test_password@localhost:5432/dim_e2e?sslmode=disable
          S3_ENDPOINT: http://localhost:9000
          S3_ACCESS_KEY: minioadmin
          S3_SECRET_KEY: minioadmin

      # Upload test artifacts on failure
      - name: Upload test logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-logs
          path: /tmp/e2e-test-output.log
          retention-days: 7
