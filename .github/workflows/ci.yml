name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.26.7'

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Lint
        uses: golangci/golangci-lint-action@v3
        with:
          version: latest

      - name: Test
        run: go test ./...

      - name: Test with race detector
        run: go test -race ./...

      - name: Cross-compile
        run: |
          GOOS=linux GOARCH=amd64 go build -o dim-linux-amd64 ./cmd/dimd
          GOOS=linux GOARCH=amd64 go build -o dimctl-linux-amd64 ./cmd/dimctl
          GOOS=darwin GOARCH=arm64 go build -o dim-darwin-arm64 ./cmd/dimd
          GOOS=darwin GOARCH=arm64 go build -o dimctl-darwin-arm64 ./cmd/dimctl
