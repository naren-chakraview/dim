name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.26.7'

      # MERGE GATE 1: Full build must succeed
      - name: Build all packages
        run: go build ./...

      # MERGE GATE 2: Vet must pass (catches type issues, unused vars, etc)
      - name: Vet
        run: go vet ./...

      # MERGE GATE 3: Lint catches style and quality issues
      - name: Lint
        uses: golangci/golangci-lint-action@v4
        with:
          version: latest
          args: --timeout=5m

      # MERGE GATE 4: All tests must pass
      - name: Test
        run: go test ./...

      # MERGE GATE 5: Race detector must pass
      - name: Test with race detector
        run: go test -race ./...

      # MERGE GATE 6: Vulnerability check
      - name: Check for vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

      # MERGE GATE 7: Cross-compile for all supported platforms
      - name: Cross-compile all platforms
        run: |
          GOOS=linux GOARCH=amd64 go build -o /tmp/dimd-linux-amd64 ./cmd/dimd
          GOOS=linux GOARCH=arm64 go build -o /tmp/dimd-linux-arm64 ./cmd/dimd
          GOOS=darwin GOARCH=amd64 go build -o /tmp/dimd-darwin-amd64 ./cmd/dimd
          GOOS=darwin GOARCH=arm64 go build -o /tmp/dimd-darwin-arm64 ./cmd/dimd
          GOOS=windows GOARCH=amd64 go build -o /tmp/dimd-windows-amd64.exe ./cmd/dimd
          GOOS=linux GOARCH=amd64 go build -o /tmp/dimctl-linux-amd64 ./cmd/dimctl
          GOOS=linux GOARCH=arm64 go build -o /tmp/dimctl-linux-arm64 ./cmd/dimctl
          GOOS=darwin GOARCH=amd64 go build -o /tmp/dimctl-darwin-amd64 ./cmd/dimctl
          GOOS=darwin GOARCH=arm64 go build -o /tmp/dimctl-darwin-arm64 ./cmd/dimctl
          GOOS=windows GOARCH=amd64 go build -o /tmp/dimctl-windows-amd64.exe ./cmd/dimctl

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: binaries
          path: /tmp/dim*
          retention-days: 1
